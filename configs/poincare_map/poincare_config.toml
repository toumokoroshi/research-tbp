# PoincareMap 設定ファイル (TOML形式)
# すべて無次元量 (Sun-Earth CR3BP 標準化)

[jacobi]
constant = 3.0009

[initial_grid]
x_min = 0.988
x_max = 0.999
x_samples = 80
# x_step = 0.00015  # x_samples の代わりに使用可

initial_vx = 0.0
initial_vz = 0.0
initial_z = 0.0

[simulation]
max_time = 300.0
time_step = 1e-3
max_crossings_per_traj = 200

[crossing]
plane_direction = 1  # +1: vy>0 (上向き), -1: vy<0
plane_velocity_threshold = 1e-7
crossing_tolerance = 1e-10

[collision]
earth_collision_radius = 1e-4
sun_collision_radius = 1e-4
escape_radius = 2.0

[output]
record_initial_crossing = true
output_basename = "poincare_map"
append_timestamp = true
