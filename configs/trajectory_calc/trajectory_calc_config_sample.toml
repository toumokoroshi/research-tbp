# TrajectoryCalc設定ファイル (TOML形式)
# 円制限三体問題の軌道計算用

[simulation]
# 計算タイムステップ (無次元時間)
calc_timestep = 0.00001
# 計算時間 (無次元時間)
time_threshold = 62.8

[chaos]
# カオス指標タイプ: "NONE", "SALI", "GALI2", "GALI4", "GALI6", "LLE"
index_type = "SALI"
# LLE用パラメータ (index_type = "LLE" の場合のみ使用)
lle_renorm_interval = 100 # 再正規化の間隔（ステップ数）
lle_skip_steps = 1000     # 初期過渡状態をスキップ（ステップ数）

[integrator]
# 積分法タイプ: "SYMPLECTIC4", "SYMPLECTIC6", "DOPRI", "RK4"
type = "DOPRI"

# DOPRI専用設定 (type = "DOPRI" の場合のみ使用)
dopri_abs_tol = 1.0e-10    # 絶対誤差許容値
dopri_rel_tol = 1.0e-10    # 相対誤差許容値
dopri_initial_step = 0.001 # 初期ステップサイズ
dopri_max_step = 0.1       # 最大ステップサイズ

[analysis]
# 周波数解析を有効にするか
enable_freq_analysis = false

[output]
# 各種出力の有効/無効を設定（デフォルト: すべてtrue）
output_trajectory = true        # 軌道データCSV出力
output_chaos_index = true       # カオス指標時系列出力
output_orbital_elements = false # 軌道要素時系列出力
output_freq_analysis = false    # 周波数解析出力
output_gnuplot = true           # gnuplotスクリプト・画像生成

