# TrajectorySali 設定ファイル (TOML形式)

[data]
# 軌道データディレクトリ (相対パスまたは絶対パス)
data_dir = "test/data/eph_cpp_result/OBT_RESULT_PHAs_GR4"

[simulation]
calc_duration_nd = 10.0
calc_timestep_nd = 0.01
forbidden_radius = 1e-6
escape_judge_hill = 1.0

[deceleration]
dv_max = 0.01
dv_step = 0.002
phase_step = 1

[integrator]
# type: "SYMPLECTIC_6TH", "SYMPLECTIC_4TH"
type = "SYMPLECTIC_6TH"

[chaos]
# index_type: "SALI", "GALI2", "GALI4", "GALI6"
index_type = "SALI"
sali_lower_limit = 1e-8
output_sali_timeseries = false
