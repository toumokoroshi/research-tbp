# SALI3dV3 設定ファイル (TOML形式)

[mesh]
center = 1  # 0: SUN, 1: EARTH
division = [50, 10, 6]
half_width = [0.011, 0.0005, 0.0005]

[simulation]
calc_timestep = 0.00001
time_threshold =500

[boundary]
soi_radius = 0.03
forbidden_area_radius = 1e-10
jacobi_integral = 3.0002

[orientation]
inclination_deg = 0
longitude_deg = 0
tangent_deg = 0

[chaos]
# index_type: "NONE", "SALI", "GALI2", "GALI4", "GALI6"
index_type = "SALI"
sali_lower_limit = 1e-14
